<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; margin: 0; background: #eee; }
        nav {
            background: navy; padding: 15px;
            display: flex; justify-content: space-around;
            flex-wrap: wrap;
        }
        button, a { padding: 10px; cursor: pointer; }
        nav button { background: white; border: 0; }
        section { background: white; margin: 20px; padding: 20px; border-radius: 10px; }
        input { padding: 10px; margin: 5px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .product { background: lightblue; padding: 15px; text-align: center; }
        .action { background: navy; color: white; border: 0; }
        @media(max-width: 600px) {
            nav { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

<nav>
    <button onclick="showPage('register')">Register</button>
    <button onclick="showPage('login')">Login</button>
    <button onclick="showPage('catalog')">Catalog</button>
    <button onclick="showPage('cart')">Cart</button>
</nav>

<section id="register">
    <h2>Registration</h2>
    <input placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button class="action" onclick="alert('Registration submitted!')">Register</button>
</section>

<section id="login">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button class="action" onclick="alert('Login submitted!')">Login</button>
</section>

<section id="catalog" hidden>
    <h2>Product Catalog</h2>
    <div class="products">
        <div class="product">
            <h3>Phone</h3><p>₹10000</p>
            <button class="action" onclick="add('Phone',10000)">Add to Cart</button>
        </div>
        <div class="product">
            <h3>Laptop</h3><p>₹40000</p>
            <button class="action" onclick="add('Laptop',40000)">Add to Cart</button>
        </div>
        <div class="product">
            <h3>Headphones</h3><p>₹1000</p>
            <button class="action" onclick="add('Headphones',1000)">Add to Cart</button>
        </div>
    </div>
</section>

<section id="cart"hidden>
    <h2>Shopping Cart</h2>
    <div id="items"></div>
    <h3 id="total">Total: ₹0</h3>
    <button class="action" onclick="checkout()">Checkout</button>
</section>

<script>
    let cart = [];

    function showPage(id) {
        document.querySelectorAll("section").forEach(s => s.hidden = true);
        document.getElementById(id).hidden = false;
    }

    function add(name, price) {
        cart.push({name, price});
        showCart();
        alert(name + " added to cart!");
    }

    function showCart() {
        let total = 0;
        document.getElementById("items").innerHTML = "";

        cart.forEach(item => {
            document.getElementById("items").innerHTML +=
                "<p>" + item.name + " - ₹" + item.price + "</p>";
            total += item.price;
        });

        document.getElementById("total").innerText = "Total: ₹" + total;
    }

    function checkout() {
        if (cart.length === 0) return alert("Cart is empty!");
        alert("Order placed!");
        cart = [];
        showCart();
    }
</script>

</body>
</html>
