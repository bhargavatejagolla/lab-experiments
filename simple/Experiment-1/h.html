
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-primary navbar-dark p-3">
    <a class="navbar-brand" href="#" onclick="show('home')">My Website</a>
    <button class="btn btn-light" onclick="show('home')">Index</button>
    <button class="btn btn-light" onclick="show('register')">Register</button>
    <button class="btn btn-light" onclick="show('login')">Login</button>
</nav>

<div id="home" class="container text-center p-5">
    <h1>Welcome to My Website</h1>
    <p>Responsive website using Bootstrap</p>
    <button class="btn btn-primary" onclick="show('register')">Get Started</button>
</div>

<div id="register" class="container col-md-5 p-4" hidden>
    <h2>Register</h2>
    <form onsubmit="alert('Registration submitted!'); return false;">
        <input class="form-control mb-3" placeholder="Name" required>
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-primary w-100">Register</button>
    </form>
</div>

<div id="login" class="container col-md-5 p-4" hidden>
    <h2>Login</h2>
    <form onsubmit="alert('Login submitted!'); return false;">
        <input type="email" class="form-control mb-3" placeholder="Email" required>
        <input type="password" class="form-control mb-3" placeholder="Password" required>
        <button class="btn btn-success w-100">Login</button>
    </form>
</div>

<footer class="bg-dark text-white text-center p-2">
    My Website © 2026
</footer>

<script>
    function show(id) {
        document.getElementById("home").hidden = true;
        document.getElementById("register").hidden = true;
        document.getElementById("login").hidden = true;
        document.getElementById(id).hidden = false;
    }
</script>

</body>
</html>
