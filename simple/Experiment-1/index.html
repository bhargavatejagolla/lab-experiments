<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar bg-primary navbar-dark p-3">
    <a class="navbar-brand" href="#home">My Website</a>
    <a class="text-white" href="#home">Index</a>
    <a class="text-white" href="#register">Register</a>
    <a class="text-white" href="#login">Login</a>
</nav>


<div id="home" class="container text-center p-5">
    <h1>Welcome to My Website</h1>
    <p>Responsive website using Bootstrap</p>
</div>



<div id="register" class="container col-md-5 p-4">
    <h2>Register</h2>
    <input class="form-control mb-2" placeholder="Name">
    <input type="email" class="form-control mb-2" placeholder="Email">
    <input type="password" class="form-control mb-2" placeholder="Password">
    <button class="btn btn-primary w-100">Register</button>
</div>



<div id="login" class="container col-md-5 p-4">
    <h2>Login</h2>
    <input type="email" class="form-control mb-2" placeholder="Email">
    <input type="password" class="form-control mb-2" placeholder="Password">
    <button class="btn btn-success w-100">Login</button>
</div>



<footer class="bg-dark text-white text-center p-2">
    My Website © 2026
</footer>



</body>
</html>
